# ClaimSense AI — Local Development Stack
#
# Two services:
#   dynamodb-local  — Amazon's official DynamoDB emulator running in Docker.
#                     Behaves identically to the real DynamoDB API; your Lambda
#                     code doesn't know the difference.
#
#   dynamodb-init   — A one-shot AWS CLI container that creates the 4 tables
#                     the moment DynamoDB Local is healthy. Exits when done.
#
# Start everything:
#   docker compose up -d
#
# Then in a separate terminal (SAM needs Docker but runs outside compose):
#   make dev
#
# Stop everything:
#   docker compose down

version: "3.8"

services:

  # --------------------------------------------------------------------------
  # DynamoDB Local
  #
  # -sharedDb      : single database file shared across all connections
  #                  (without this, each AWS region gets its own file)
  # -inMemory      : data lives in RAM — fast, but wiped on container restart.
  #                  Remove this flag if you want data to survive restarts
  #                  (add a volume mount instead).
  # Port 8001 on the host maps to 8000 inside the container so it doesn't
  # clash with SAM local which also uses 8000 by default.
  # --------------------------------------------------------------------------
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    container_name: claimsense-dynamodb
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --------------------------------------------------------------------------
  # Table initialisation
  #
  # Uses the official AWS CLI image to create the 4 DynamoDB tables.
  # Waits for DynamoDB Local to be healthy first (depends_on + condition).
  # The fake AWS credentials are required by the CLI even though there is no
  # real AWS account involved — DynamoDB Local accepts any non-empty values.
  #
  # Each `aws dynamodb create-table` call mirrors the schema in template.yaml
  # exactly. If you change a table definition there, update it here too.
  # --------------------------------------------------------------------------
  dynamodb-init:
    image: amazon/aws-cli:2.17.0
    container_name: claimsense-dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh -c
    command: |
      "
      ENDPOINT=http://dynamodb-local:8000

      echo 'Creating claimsense-claims-dev...'
      aws dynamodb create-table \
        --endpoint-url $$ENDPOINT \
        --table-name claimsense-claims-dev \
        --billing-mode PAY_PER_REQUEST \
        --key-schema AttributeName=claim_id,KeyType=HASH \
        --attribute-definitions AttributeName=claim_id,AttributeType=S \
        --no-cli-pager || echo 'Table already exists, skipping.'

      echo 'Creating claimsense-policies-dev...'
      aws dynamodb create-table \
        --endpoint-url $$ENDPOINT \
        --table-name claimsense-policies-dev \
        --billing-mode PAY_PER_REQUEST \
        --key-schema AttributeName=policy_id,KeyType=HASH \
        --attribute-definitions AttributeName=policy_id,AttributeType=S \
        --no-cli-pager || echo 'Table already exists, skipping.'

      echo 'Creating claimsense-documents-dev...'
      aws dynamodb create-table \
        --endpoint-url $$ENDPOINT \
        --table-name claimsense-documents-dev \
        --billing-mode PAY_PER_REQUEST \
        --key-schema \
          AttributeName=claim_id,KeyType=HASH \
          AttributeName=document_id,KeyType=RANGE \
        --attribute-definitions \
          AttributeName=claim_id,AttributeType=S \
          AttributeName=document_id,AttributeType=S \
        --no-cli-pager || echo 'Table already exists, skipping.'

      echo 'Creating claimsense-decisions-dev...'
      aws dynamodb create-table \
        --endpoint-url $$ENDPOINT \
        --table-name claimsense-decisions-dev \
        --billing-mode PAY_PER_REQUEST \
        --key-schema AttributeName=idempotency_key,KeyType=HASH \
        --attribute-definitions \
          AttributeName=idempotency_key,AttributeType=S \
          AttributeName=claim_id,AttributeType=S \
          AttributeName=confirmed_at,AttributeType=S \
        --global-secondary-indexes \
          '[{"IndexName":"claim_id-index","KeySchema":[{"AttributeName":"claim_id","KeyType":"HASH"},{"AttributeName":"confirmed_at","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' \
        --no-cli-pager || echo 'Table already exists, skipping.'

      echo 'All tables ready.'
      "
