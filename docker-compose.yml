# ClaimSense AI — Local Development Stack
#
# Runs DynamoDB Local on port 8001.
# Tables are created by seed_dynamo.py (ensure_tables) when `make seed` runs.
#
# Start:  docker compose up -d
# Stop:   docker compose down

services:

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    container_name: claimsense-dynamodb
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
