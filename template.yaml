AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClaimSense AI — Claims Adjudication Co-pilot

# ---------------------------------------------------------------------------
# Globals apply to every Lambda function unless overridden per-function.
# Runtime, timeout, and environment variables are set once here.
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        # Table names are injected as env vars so the Lambda code never
        # hard-codes a table name. Locally these resolve to the same strings;
        # on AWS, !Ref resolves to the actual provisioned table name.
        CLAIMS_TABLE:    !Ref ClaimsTable
        POLICIES_TABLE:  !Ref PoliciesTable
        DOCUMENTS_TABLE: !Ref DocumentsTable
        DECISIONS_TABLE: !Ref DecisionsTable
        # Overridden in env.local.json for local dev (points to DynamoDB Local)
        DYNAMODB_ENDPOINT: ""

# ---------------------------------------------------------------------------
# Parameters let you pass values at deploy time (e.g. different environments).
# ---------------------------------------------------------------------------
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage

# ===========================================================================
# RESOURCES
# ===========================================================================
Resources:

  # -------------------------------------------------------------------------
  # COGNITO — User pool for adjuster authentication
  #
  # The user pool is where adjuster accounts live. The client is what the
  # React app uses to sign in. API Gateway uses the pool ARN to validate
  # every incoming JWT — no token, no Lambda invocation.
  # -------------------------------------------------------------------------
  AdjusterUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub claimsense-adjusters-${Stage}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false

  AdjusterUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub claimsense-react-app-${Stage}
      UserPoolId: !Ref AdjusterUserPool
      GenerateSecret: false           # React SPA — no server secret needed
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH         # Secure Remote Password (standard web login)
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1          # hours
      RefreshTokenValidity: 7         # days

  # -------------------------------------------------------------------------
  # API GATEWAY — Single HTTP API in front of all three Lambdas
  #
  # Every route requires a valid Cognito JWT in the Authorization header.
  # The JWT is verified here before the Lambda even starts — the Lambda
  # never makes access decisions, it just processes the request.
  # -------------------------------------------------------------------------
  ClaimSenseApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub claimsense-api-${Stage}
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Adjuster-Id,Idempotency-Key'"
        AllowOrigin: "'*'"             # tighten to CloudFront domain in prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt AdjusterUserPool.Arn

  # -------------------------------------------------------------------------
  # CMS LAMBDA — Claims Management System
  #
  # Handles two routes:
  #   GET  /claims/{claim_id}           → read a claim record
  #   POST /claims/{claim_id}/decision  → write a confirmed decision (idempotent)
  #
  # The POST is the only write path in the entire system (ADR-004).
  # Idempotency is enforced via the Idempotency-Key header.
  # -------------------------------------------------------------------------
  CMSFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub claimsense-cms-${Stage}
      CodeUri: src/api/cms/
      Handler: handler.lambda_handler
      Description: Claims Management System — read claims, write decisions
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - DynamoDBCrudPolicy:            # write only for decisions table
            TableName: !Ref DecisionsTable
      Events:
        GetClaim:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /claims/{claim_id}
            Method: GET
        PostDecision:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /claims/{claim_id}/decision
            Method: POST

  # -------------------------------------------------------------------------
  # PAS LAMBDA — Policy Administration System
  #
  # Read-only. Returns the policy record for a given policy_id.
  # Coverage type (Full / Liability Only), deductibles, in-force status.
  # -------------------------------------------------------------------------
  PASFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub claimsense-pas-${Stage}
      CodeUri: src/api/pas/
      Handler: handler.lambda_handler
      Description: Policy Administration System — read policy records
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PoliciesTable
      Events:
        GetPolicy:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /policies/{policy_id}
            Method: GET

  # -------------------------------------------------------------------------
  # DOCSTORE LAMBDA — Document Store
  #
  # Two routes:
  #   GET  /documents/{claim_id}  → list all documents for a claim
  #   POST /search                → BM25 search over policy corpus
  #
  # The /search endpoint is what the Coverage Check agent calls.
  # It must return cited clause IDs — never bare text without a clause ID.
  # -------------------------------------------------------------------------
  DocStoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub claimsense-docstore-${Stage}
      CodeUri: src/api/docstore/
      Handler: handler.lambda_handler
      Description: Document Store — claim documents and BM25 policy search
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
      Events:
        GetDocuments:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /documents/{claim_id}
            Method: GET
        SearchCorpus:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /search
            Method: POST

  # ===========================================================================
  # DYNAMODB TABLES
  #
  # BillingMode: PAY_PER_REQUEST means zero cost when idle — no provisioned
  # capacity to pay for around the clock. Perfect for a dev/pilot workload.
  # ===========================================================================

  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claimsense-claims-${Stage}
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: claim_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: claim_id
          AttributeType: S

  PoliciesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claimsense-policies-${Stage}
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: policy_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: policy_id
          AttributeType: S

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claimsense-documents-${Stage}
      BillingMode: PAY_PER_REQUEST
      # claim_id (partition) + document_id (sort) lets you fetch all docs
      # for a claim in one query, or a single document by both keys.
      KeySchema:
        - AttributeName: claim_id
          KeyType: HASH
        - AttributeName: document_id
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: claim_id
          AttributeType: S
        - AttributeName: document_id
          AttributeType: S

  DecisionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claimsense-decisions-${Stage}
      BillingMode: PAY_PER_REQUEST
      # Keyed on idempotency_key — the SHA-256 hash of claim:adjuster:verdict.
      # A duplicate POST returns the existing record rather than writing again.
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S

# ===========================================================================
# OUTPUTS — values printed after `sam deploy`, referenced by the React app
# ===========================================================================
Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${ClaimSenseApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  UserPoolId:
    Description: Cognito User Pool ID (needed by React Amplify config)
    Value: !Ref AdjusterUserPool

  UserPoolClientId:
    Description: Cognito App Client ID (needed by React Amplify config)
    Value: !Ref AdjusterUserPoolClient
