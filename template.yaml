AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClaimSense AI — Claims Adjudication Co-pilot

# ---------------------------------------------------------------------------
# Globals apply to every Lambda function unless overridden per-function.
# Runtime, timeout, and environment variables are set once here.
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        # Table names are injected as env vars so the Lambda code never
        # hard-codes a table name. Locally these resolve to the same strings;
        # on AWS, !Ref resolves to the actual provisioned table name.
        CLAIMS_TABLE:    !Ref ClaimsTable
        POLICIES_TABLE:  !Ref PoliciesTable
        DOCUMENTS_TABLE: !Ref DocumentsTable
        DECISIONS_TABLE: !Ref DecisionsTable
        # Overridden in env.local.json for local dev (points to DynamoDB Local)
        DYNAMODB_ENDPOINT: ""
        # Bedrock Knowledge Base ID — injected at deploy time
        # Set manually in env.local.json for local dev (points at real Bedrock)
        KNOWLEDGE_BASE_ID: !Ref PolicyKnowledgeBase
        DOCS_BUCKET:       !Ref PolicyDocsBucket

# ---------------------------------------------------------------------------
# Parameters let you pass values at deploy time (e.g. different environments).
# ---------------------------------------------------------------------------
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage

# ===========================================================================
# RESOURCES
# ===========================================================================
Resources:

  # -------------------------------------------------------------------------
  # COGNITO — User pool for adjuster authentication
  #
  # The user pool is where adjuster accounts live. The client is what the
  # React app uses to sign in. API Gateway uses the pool ARN to validate
  # every incoming JWT — no token, no Lambda invocation.
  # -------------------------------------------------------------------------
  AdjusterUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub claimsense-adjusters-${Stage}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false

  AdjusterUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub claimsense-react-app-${Stage}
      UserPoolId: !Ref AdjusterUserPool
      GenerateSecret: false           # React SPA — no server secret needed
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH         # Secure Remote Password (standard web login)
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1          # hours
      RefreshTokenValidity: 7         # days

  # -------------------------------------------------------------------------
  # API GATEWAY — Single HTTP API in front of all three Lambdas
  #
  # Every route requires a valid Cognito JWT in the Authorization header.
  # The JWT is verified here before the Lambda even starts — the Lambda
  # never makes access decisions, it just processes the request.
  # -------------------------------------------------------------------------
  ClaimSenseApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub claimsense-api-${Stage}
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Adjuster-Id,Idempotency-Key'"
        AllowOrigin: "'*'"             # tighten to CloudFront domain in prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt AdjusterUserPool.Arn

  # -------------------------------------------------------------------------
  # CMS LAMBDA — Claims Management System
  #
  # Handles two routes:
  #   GET  /claims/{claim_id}           → read a claim record
  #   POST /claims/{claim_id}/decision  → write a confirmed decision (idempotent)
  #
  # The POST is the only write path in the entire system (ADR-004).
  # Idempotency is enforced via the Idempotency-Key header.
  # -------------------------------------------------------------------------
  CMSFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub claimsense-cms-${Stage}
      CodeUri: src/api/cms/
      Handler: handler.lambda_handler
      Description: Claims Management System — read claims, write decisions
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - DynamoDBCrudPolicy:            # write only for decisions table
            TableName: !Ref DecisionsTable
      Events:
        GetClaim:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /claims/{claim_id}
            Method: GET
        PostDecision:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /claims/{claim_id}/decision
            Method: POST

  # -------------------------------------------------------------------------
  # PAS LAMBDA — Policy Administration System
  #
  # Read-only. Returns the policy record for a given policy_id.
  # Coverage type (Full / Liability Only), deductibles, in-force status.
  # -------------------------------------------------------------------------
  PASFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub claimsense-pas-${Stage}
      CodeUri: src/api/pas/
      Handler: handler.lambda_handler
      Description: Policy Administration System — read policy records
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PoliciesTable
      Events:
        GetPolicy:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /policies/{policy_id}
            Method: GET

  # -------------------------------------------------------------------------
  # DOCSTORE LAMBDA — Document Store
  #
  # Two routes:
  #   GET  /documents/{claim_id}  → list all documents for a claim
  #   POST /search                → Bedrock Knowledge Base retrieval
  #
  # The /search endpoint is what the Coverage Check agent calls.
  # It queries the Bedrock Knowledge Base and returns relevant policy
  # clause chunks. Every result includes a source location (clause ID)
  # so the agent can cite it — never from model memory.
  # -------------------------------------------------------------------------
  DocStoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub claimsense-docstore-${Stage}
      CodeUri: src/api/docstore/
      Handler: handler.lambda_handler
      Description: Document Store — claim documents and Bedrock policy search
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
        # Allow Lambda to call Bedrock Knowledge Base retrieve API
        - Statement:
            Effect: Allow
            Action:
              - bedrock:Retrieve
              - bedrock:RetrieveAndGenerate
            Resource: !GetAtt PolicyKnowledgeBase.KnowledgeBaseArn
        # Allow Lambda to read policy PDFs from S3 (for future doc serving)
        - S3ReadPolicy:
            BucketName: !Ref PolicyDocsBucket
      Events:
        GetDocuments:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /documents/{claim_id}
            Method: GET
        SearchCorpus:
          Type: Api
          Properties:
            RestApiId: !Ref ClaimSenseApi
            Path: /search
            Method: POST

  # ===========================================================================
  # DYNAMODB TABLES
  #
  # BillingMode: PAY_PER_REQUEST means zero cost when idle — no provisioned
  # capacity to pay for around the clock. Perfect for a dev/pilot workload.
  # ===========================================================================

  ClaimsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claimsense-claims-${Stage}
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: claim_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: claim_id
          AttributeType: S

  PoliciesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claimsense-policies-${Stage}
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: policy_id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: policy_id
          AttributeType: S

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claimsense-documents-${Stage}
      BillingMode: PAY_PER_REQUEST
      # claim_id (partition) + document_id (sort) lets you fetch all docs
      # for a claim in one query, or a single document by both keys.
      KeySchema:
        - AttributeName: claim_id
          KeyType: HASH
        - AttributeName: document_id
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: claim_id
          AttributeType: S
        - AttributeName: document_id
          AttributeType: S

  DecisionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub claimsense-decisions-${Stage}
      BillingMode: PAY_PER_REQUEST
      # Keyed on idempotency_key — the SHA-256 hash of claim:adjuster:verdict.
      # A duplicate POST returns the existing record rather than writing again.
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
        - AttributeName: claim_id
          AttributeType: S
        - AttributeName: confirmed_at
          AttributeType: S
      # GSI lets the CMS Lambda look up decisions by claim_id (for GET /claims/{id})
      GlobalSecondaryIndexes:
        - IndexName: claim_id-index
          KeySchema:
            - AttributeName: claim_id
              KeyType: HASH
            - AttributeName: confirmed_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ===========================================================================
  # S3 BUCKET — Policy document storage
  #
  # One bucket shared across all environments, prefixed by stage.
  # Bedrock ingests the policy manual PDF from here.
  # Versioning is enabled so ingestion history is preserved.
  # ===========================================================================
  PolicyDocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub claimsense-docs-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ===========================================================================
  # BEDROCK KNOWLEDGE BASE IAM ROLE
  #
  # Bedrock needs permission to read from S3 and call the embedding model.
  # This role is assumed by the Knowledge Base service, not by Lambda.
  # ===========================================================================
  BedrockKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub claimsense-bedrock-kb-role-${Stage}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ReadForIngestion
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt PolicyDocsBucket.Arn
                  - !Sub "${PolicyDocsBucket.Arn}/*"
        - PolicyName: BedrockEmbeddingAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  # Amazon Titan Embeddings G1 — used to embed policy clauses
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v1"

  # ===========================================================================
  # BEDROCK KNOWLEDGE BASE
  #
  # Points at the S3 bucket. Bedrock ingests the policy manual PDF,
  # chunks it by section, embeds each chunk with Titan Embeddings,
  # and stores the vectors in a Bedrock-managed store.
  #
  # After first deploy, trigger ingestion manually:
  #   aws bedrock-agent start-ingestion-job \
  #     --knowledge-base-id <id> \
  #     --data-source-id <id>
  #
  # Or add the policy PDF to S3 — Bedrock can be configured to auto-ingest.
  # ===========================================================================
  PolicyKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub claimsense-policy-kb-${Stage}
      Description: AutoSure policy manual — used by Coverage Check agent for clause retrieval
      RoleArn: !GetAtt BedrockKnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v1"
      StorageConfiguration:
        # OPENSEARCH_SERVERLESS is the Bedrock-managed default.
        # AWS provisions and manages the vector store — no setup needed.
        Type: OPENSEARCH_SERVERLESS

  PolicyKnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name: !Sub claimsense-policy-manual-${Stage}
      KnowledgeBaseId: !Ref PolicyKnowledgeBase
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt PolicyDocsBucket.Arn
          InclusionPrefixes:
            - !Sub "${Stage}/policy-manual/"

# ===========================================================================
# OUTPUTS — values printed after `sam deploy`, referenced by the React app
# ===========================================================================
Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${ClaimSenseApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  UserPoolId:
    Description: Cognito User Pool ID (needed by React Amplify config)
    Value: !Ref AdjusterUserPool

  UserPoolClientId:
    Description: Cognito App Client ID (needed by React Amplify config)
    Value: !Ref AdjusterUserPoolClient

  PolicyDocsBucketName:
    Description: S3 bucket for policy manual PDFs
    Value: !Ref PolicyDocsBucket

  KnowledgeBaseId:
    Description: Bedrock Knowledge Base ID (needed by env.local.json for local dev)
    Value: !Ref PolicyKnowledgeBase
